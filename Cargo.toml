[package]
name = "ubuild"
version = "0.1.18"
edition = "2021"
rust-version = "1.89"
description = "Unreal Engine project management CLI tool"
license = "MIT"
repository = "https://github.com/Ziiilk/ubuild"
readme = "README.md"

[[bin]]
name = "ubuild"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
console = "0.15"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
dialoguer = "0.11"
glob = "0.3"
send_ctrlc = "0.6"
tempfile = "3"
sha2 = "0.10"
getrandom = "0.3"
self_update = { version = "0.42", default-features = false, features = [
    "rustls",
    "archive-zip",
    "archive-tar",
    "compression-zip-deflate",
    "compression-flate2",
] }

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5"
winreg = "0.52"
win32job = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal"] }
signal-hook = "0.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
too_many_arguments = "allow"
fn_params_excessive_bools = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"

[profile.release]
strip = true
lto = true
codegen-units = 1

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
