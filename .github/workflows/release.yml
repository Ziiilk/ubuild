name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package artifact
        shell: bash
        run: |
          cp "target/x86_64-pc-windows-msvc/release/ubuild.exe" ubuild.exe
          7z a "ubuild-x86_64-pc-windows-msvc.zip" ubuild.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuild-x86_64-pc-windows-msvc.zip
          path: ubuild-x86_64-pc-windows-msvc.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
